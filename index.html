<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbearia Corte Fino</title>
  <meta name="description" content="Barbearia Corte Fino — agende pelo WhatsApp, veja nosso trabalho e avalie no Google.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="bio" id="app" aria-live="polite">
    <!-- 1. Capa + 2. Identidade (texto sobre a foto) -->
    <header class="hero" id="cover">
      <!-- 0. Barra de ações -->
      <div class="topbar">
        <button class="icon-btn" id="btn-share" aria-label="Compartilhar perfil"></button>
        <div class="menu-wrap">
          <button class="icon-btn" id="btn-menu" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false"></button>
          <div class="menu" id="menu" role="menu" hidden></div>
        </div>
      </div>
      <div class="hero-content">
        <div class="avatar" id="avatar"></div>
        <h1 class="name" id="name"></h1>
        <p class="handle" id="handle"></p>
      </div>
    </header>

    <!-- 3. Linha de ações: WhatsApp + redes (uma linha, com setas) -->
    <div class="actions" id="actions">
      <button class="scroll-arrow scroll-left" id="arrow-left" aria-label="Rolar para a esquerda" hidden></button>
      <nav class="chips" id="chips" aria-label="Contato e redes sociais"></nav>
      <button class="scroll-arrow scroll-right" id="arrow-right" aria-label="Rolar para a direita" hidden></button>
    </div>

    <!-- 4. Sobre -->
    <section class="section" id="sec-about">
      <h2 class="section-title">Sobre</h2>
      <p class="about" id="about"></p>
    </section>

    <!-- 5. Links -->
    <section class="section" id="sec-links">
      <h2 class="section-title">Links</h2>
      <div class="links" id="links"></div>
    </section>

    <!-- 6. Avalie no Google -->
    <section class="section" id="sec-review">
      <div class="review" id="review"></div>
    </section>

    <!-- 7. Galeria -->
    <section class="section" id="sec-gallery">
      <h2 class="section-title" id="gallery-title">Galeria</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- 8. Rodapé -->
    <footer class="footer" id="footer"></footer>
  </main>

  <!-- Lightbox da galeria -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imagem ampliada" hidden>
    <button class="lb-btn lb-close" id="lb-close" aria-label="Fechar"></button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Imagem anterior"></button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Próxima imagem"></button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
